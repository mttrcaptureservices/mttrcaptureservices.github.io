const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
/* replaceChildren that accepts nested arrays and skips empty values, like h() does */
const _replace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return _replace.apply(this, kids.flat(Infinity).filter(k => k != null && k !== false)); };
const isBlank = v => v == null || v === '' || (Array.isArray(v) && !v.length);
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (Array.isArray(v) ? num(v[0]) : 0);
const money = (v, cur = 'USD', digits = 0) => {
  if (v == null || v === '' || !isFinite(v)) return '—';
  try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: cur, maximumFractionDigits: digits, minimumFractionDigits: digits }).format(v); }
  catch { return Number(v).toLocaleString('en-US') + ' ' + cur; }
};
const compact = v => (v == null || !isFinite(v)) ? '—' : '$' + new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(v);
const pct = v => (v == null || v === '' || !isFinite(v)) ? '—' : Math.round(v * 100) + '%';
const parseDate = v => { if (!v) return null; const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T00:00:00' : v); return isNaN(d) ? null : d; };
const fmtDate = v => { const d = parseDate(v); return d ? d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '—'; };
const fmtDateTime = v => { const d = parseDate(v); return d ? d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'; };
const daysUntil = v => { const d = parseDate(v); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); };

  if (!S.meta[CFG.t.opps]) { view.replaceChildren(h('p', { class: 'empty' }, 'Your token cannot read the opportunities table.')); return; }
  const won = o => /won/i.test(oppStage(o)), lost = o => /lost/i.test(oppStage(o));
  const sets = { ready: opps.filter(o => won(o) && isBlank(o.fields[OPP.clientLink])), open: opps.filter(o => !won(o) && !lost(o)), won: opps.filter(won) };
  const body = h('div');
  const paint = () => { const rows = sets[OV];
    body.replaceChildren(h('p', { class: 'muted summary' }, `${rows.length} opportunit${rows.length === 1 ? 'y' : 'ies'} · ${money(sum(rows, o => num(o.fields[OPP.usd])))}`),
      rows.length ? oppTable(rows.slice(0, 300), OV === 'won' ? null : o => S.canWrite && (OV === 'ready' || won(o)) ? h('a', { class: 'btn small primary', href: '#/new/opp/' + o.id }, 'Create client') : '') : h('p', { class: 'empty' }, OV === 'ready' ? 'Every closed-won opportunity already has a client record.' : 'Nothing here.')); };
  view.replaceChildren(h('div', { class: 'pagehead' }, h('div', null, h('h1', null, 'Opportunities'), h('p', { class: 'muted' }, 'Read-only from Salesforce. Closed-won deals without a client record are ready to onboard.'))),
    h('div', { class: 'toolbar' }, h('div', { class: 'seg' }, [['ready', `Ready to onboard ${sets.ready.length}`], ['open', `Open pipeline ${sets.open.length}`], ['won', `All closed won ${sets.won.length}`]].map(([k, t]) =>
      h('button', { class: OV === k ? 'on' : '', onclick: e => { OV = k; e.currentTarget.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); paint(); } }, t)))), body);
  paint();
}

/* ───────── reports ───────── */
const RV = { dim: 'region', metric: 'commit', scope: 'Active' };
const DIMS = { region: ['Region', c => str(val(c, 'region'))], industry: ['Industry', c => str(val(c, 'industry'))], priceType: ['Price type', c => str(val(c, 'priceType'))], contractType: ['Contract type', c => str(val(c, 'contractType'))],
  salesperson: ['Salesperson', c => str(val(c, 'salesperson'))], csm: ['CSM', c => str(val(c, 'csm'))], capservPoc: ['CapServ POC', c => str(val(c, 'capservPoc'))], stage: ['Stage', c => c.x.stage], billTerms: ['Billing terms', c => str(val(c, 'billTerms'))],
  year: ['Year signed', c => str(val(c, 'ssaDate')).slice(0, 4)], endq: ['Quarter ending', c => { const d = parseDate(val(c, 'fulfillDate')); return d ? `${d.getFullYear()} Q${Math.floor(d.getMonth() / 3) + 1}` : ''; }] };
const METRICS = { count: ['Clients', () => 1, v => v], commit: ['Commitment (USD)', c => c.x.commit, money], done: ['Used to date (USD)', c => c.x.done, money], wip: ['In flight (USD)', c => c.x.wip, money], remain: ['Remaining (USD)', c => Math.max(0, c.x.remain), money] };
function groupBy(rows, dimFn, metFn) { const m = new Map(); rows.forEach(c => { const k = dimFn(c) || '(blank)'; const e = m.get(k) || { n: 0, v: 0, commit: 0, done: 0 }; e.n++; e.v += metFn(c) || 0; e.commit += c.x.commit; e.done += c.x.done; m.set(k, e); }); return [...m.entries()]; }
function viewReports(view) {
  const act = active(); const now = new Date();
  const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const next12 = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() + i, 1));
  const last12 = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() - 11 + i, 1));
  const lab = d => MONTHS[d.getMonth()] + ' ’' + String(d.getFullYear()).slice(2);
  const renew = next12.map(d => { const cs = act.filter(c => str(val(c, 'fulfillDate')).slice(0, 7) === ym(d)); return [lab(d), cs.length, sum(cs, c => Math.max(0, c.x.remain))]; });
  const signed = last12.map(d => { const cs = S.clients.filter(c => str(val(c, 'ssaDate')).slice(0, 7) === ym(d)); return [lab(d), sum(cs, c => c.x.commit), cs.length]; });
  const paceN = { Ahead: 0, 'On track': 0, Behind: 0 }; act.forEach(c => { if (c.x.pace && c.x.commit) paceN[c.x.pace]++; }); const paceTot = Math.max(1, paceN.Ahead + paceN['On track'] + paceN.Behind);
  const top = [...act].sort((a, b) => b.x.commit - a.x.commit).slice(0, 12);
  const bands = [['Under $5k', 0, 5e3], ['$5k–$15k', 5e3, 15e3], ['$15k–$50k', 15e3, 5e4], ['$50k–$150k', 5e4, 15e4], ['$150k+', 15e4, Infinity]].map(([n, lo, hi]) => { const cs = act.filter(c => c.x.commit > 0 && c.x.commit >= lo && c.x.commit < hi); return [n, cs.length, sum(cs, c => c.x.commit)]; });
  const dq = [['No order link', c => !val(c, 'shortLink')], ['No signed date', c => !val(c, 'ssaDate')], ['No end date', c => !val(c, 'fulfillDate')], ['No client contact email', c => !val(c, 'pocEmail')], ['No salesperson', c => !val(c, 'salesperson')],
    ['Usage email frequency not set', c => !val(c, 'emailFrequency')], ['Commitment without USD value', c => num(val(c, 'commitment')) > 0 && !c.x.commit]].map(([n, f]) => [n, act.filter(f)]);
  const months = MONTHS.map((m, i) => [m, sum(S.clients, c => num(c.fields[MONTH_IDS[i]]))]);

  const out = h('div');
  const paintBuilder = () => { const rows0 = RV.scope === 'All' ? S.clients : S.clients.filter(c => c.x.status === RV.scope); const [, mf, fmt] = METRICS[RV.metric];
    const rows = groupBy(rows0, DIMS[RV.dim][1], mf).sort((a, b) => b[1].v - a[1].v);
    out.replaceChildren(barList(rows.slice(0, 25).map(([k, e]) => [k, e.v]), { fmt }),
      h('div', { class: 'tablewrap' }, h('table', { class: 'grid' }, h('thead', null, h('tr', null, [DIMS[RV.dim][0], 'Clients', 'Commitment', 'Used', 'Used %'].map((t, i) => h('th', { class: i ? 'num' : '' }, t)))),
        h('tbody', null, rows.map(([k, e]) => h('tr', null, h('td', null, k), h('td', { class: 'num' }, e.n), h('td', { class: 'num' }, money(e.commit)), h('td', { class: 'num' }, money(e.done)), h('td', { class: 'num' }, e.commit ? pct(e.done / e.commit) : '—')))))),
      h('button', { class: 'btn', onclick: () => downloadCsv(`clients-by-${RV.dim}.csv`, [[DIMS[RV.dim][0], 'Clients', 'Commitment USD', 'Used USD'], ...rows.map(([k, e]) => [k, e.n, Math.round(e.commit), Math.round(e.done)])]) }, 'Export CSV')); };
  const pick = (obj, key, lbl) => h('label', null, lbl, ' ', h('select', { onchange: e => { RV[key] = e.target.value; paintBuilder(); } }, Object.entries(obj).map(([k, v]) => h('option', { value: k, selected: RV[key] === k }, Array.isArray(v) ? v[0] : v))));
  const card = (title, note, ...kids) => h('section', { class: 'card' }, h('h2', null, title), note ? h('p', { class: 'muted' }, note) : null, kids);

  view.replaceChildren(h('div', { class: 'pagehead' }, h('div', null, h('h1', null, 'Reports'), h('p', { class: 'muted' }, 'Live from Airtable. Amounts are USD, estimated from operational data rather than invoices.'))),
    h('div', { class: 'grid2' },
      card('Renewal calendar — contracts ending per month', 'Active contracts by capture-period end date. The unused balance is what is forfeited if nothing changes.',
        colChart(renew.map(r => [r[0], r[1]])), h('table', { class: 'grid mini' }, h('thead', null, h('tr', null, h('th', null, 'Month'), h('th', { class: 'num' }, 'Ending'), h('th', { class: 'num' }, 'Unused balance'))),
          h('tbody', null, renew.filter(r => r[1]).map(r => h('tr', null, h('td', null, r[0]), h('td', { class: 'num' }, r[1]), h('td', { class: 'num' }, money(r[2]))))))),
      card('Pacing of active commitments', 'Share of commitment used compared with share of term elapsed.',
        h('div', { class: 'stack', role: 'img', 'aria-label': `Ahead ${paceN.Ahead}, on track ${paceN['On track']}, behind ${paceN.Behind}` }, [['Ahead', 'good'], ['On track', ''], ['Behind', 'bad']].map(([k, cls]) => h('div', { class: 'seg-' + (cls || 'mid'), style: { width: (paceN[k] / paceTot * 100) + '%' }, title: `${k}: ${paceN[k]}` }, paceN[k] ? `${k} ${paceN[k]}` : ''))),
        h('h3', null, 'Commitment size (active)'), barList(bands.map(b => [`${b[0]} · ${b[1]} clients`, b[2]]), { fmt: compact }))),
    h('div', { class: 'grid2' },
      card('New commitments signed per month (USD)', 'By SSA signed date, last 12 months.', colChart(signed.map(r => [r[0], r[1]]), compact)),
      card('Completed revenue by month (USD, this year)', null, colChart(months, compact))),
    h('div', { class: 'grid2' },
      card('Largest active commitments', 'Dark bar: commitment. Light bar: used to date.', barList(top.map(c => [c.x.name, c.x.commit, c.x.done]), { fmt: compact })),
      card('Data quality — active clients', 'Gaps that stop automations or reports from working.', h('ul', { class: 'rowlist' }, dq.map(([n, cs]) => h('li', null, h('details', null, h('summary', null, n, h('span', { class: 'count' }, cs.length)), cs.length ? h('div', { class: 'chips' }, cs.slice(0, 60).map(c => h('a', { class: 'chip', href: '#/clients/' + c.id }, c.x.name))) : h('span', { class: 'muted' }, 'None'))))))),
    card('Build your own breakdown', null, h('div', { class: 'toolbar' }, pick(METRICS, 'metric', 'Show'), pick(DIMS, 'dim', 'by'), pick({ Active: 'Active contracts', Expired: 'Expired contracts', All: 'All contracts' }, 'scope', 'for')), out));
  paintBuilder();
}

/* ───────── start ───────── */
(async function boot() {
  let t = null; try { t = sessionStorage.getItem(SESSION); } catch { /* ignore */ }
  if (t) { try { await connect(t); renderShell(); return; } catch { try { sessionStorage.removeItem(SESSION); } catch { /* ignore */ } } }
  renderGate();
})();
</script>
</body>
</html>
