<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Approval | Matterport</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Header bar ─────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
    }

    header svg { height: 28px; width: auto; }

    /* ── Card ────────────────────────────────────────────── */
    main {
      margin-top: 64px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      width: 100%;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      padding: 56px 48px 48px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 50%;
      margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .icon-wrap.loading { background: #fff4ee; animation: pulse 1.4s ease-in-out infinite; }
    .icon-wrap.success { background: #f0fdf4; }
    .icon-wrap.error   { background: #fef2f2; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.95); }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.65;
      max-width: 360px;
      margin: 0 auto;
    }

    .pill {
      display: inline-block;
      margin-top: 24px;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pill.loading { background: #fff4ee; color: #cc3d00; }
    .pill.success { background: #dcfce7; color: #15803d; }
    .pill.error   { background: #fee2e2; color: #b91c1c; }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      font-size: 12px;
      color: #9ca3af;
      padding: 24px;
      text-align: center;
    }
    footer a { color: #9ca3af; text-decoration: none; }
    footer a:hover { color: #ff4d00; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <!-- Matterport wordmark SVG (CoStar era) -->
    <svg viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Matterport">
      <!-- M mark -->
      <path d="M4 32V8l12 14 12-14v24" stroke="#FF4D00" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Wordmark -->
      <text x="36" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
            font-size="17" font-weight="700" fill="#111827" letter-spacing="-0.3">atterport</text>
    </svg>
  </header>

  <main>
    <div class="card">
      <div class="icon-wrap loading" id="icon">⏳</div>
      <h1 id="title">Processing your approval…</h1>
      <p id="message">Please hold on while we record your response.</p>
      <span class="pill loading" id="pill">In Progress</span>
    </div>
  </main>

  <footer>
    &copy; 2025 Matterport, Inc. &nbsp;·&nbsp;
    <a href="https://matterport.com/privacy-policy" target="_blank">Privacy Policy</a>
  </footer>

  <script>
    (function () {
      // Zapier catch-hook — use GET so the browser never fires a CORS preflight
      var WEBHOOK = "https://hooks.zapier.com/hooks/catch/10664871/4bdz3nt/";
      var recordId = new URLSearchParams(window.location.search).get("record_id") || "";

      function setUI(type, emoji, title, message, pill) {
        document.getElementById("icon").className  = "icon-wrap " + type;
        document.getElementById("icon").textContent = emoji;
        document.getElementById("title").textContent   = title;
        document.getElementById("message").textContent = message;
        document.getElementById("pill").className   = "pill " + type;
        document.getElementById("pill").textContent  = pill;
      }

      if (!recordId) {
        setUI("error", "⚠️",
          "Invalid approval link",
          "This link appears to be incomplete. Please use the approval link from your email.",
          "Invalid Link");
        return;
      }

      // GET request — Zapier receives record_id as a query param; no CORS preflight needed
      var url = WEBHOOK + "?record_id=" + encodeURIComponent(recordId);

      fetch(url, { mode: "no-cors" })
        .then(function () {
          setUI("success", "✅",
            "Thank you!",
            "Your approval has been received and your order is now being processed.",
            "Approved");
        })
        .catch(function (err) {
          console.error("Webhook error:", err);
          setUI("error", "❌",
            "Something went wrong",
            "We couldn't record your approval. Please try clicking the link again or contact support.",
            "Error");
        });
    })();
  </script>
</body>
</html>
