name: Job Rate Calculator snapshot

on:
  schedule:
    - cron: "0 10 * * *"   # 02:00 PST / 03:00 PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jrc-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build encrypted snapshot
        env:
          AIRTABLE_TOKEN: ${{ secrets.JRC_AIRTABLE_TOKEN }}
          CALC_USERS: ${{ secrets.JRC_USERS }}
        run: node job-rate/scripts/build-snapshot.js
      - name: Commit
        run: |
          git config user.name "jrc-snapshot"
          git config user.email "jrc-snapshot@users.noreply.github.com"
          git add job-rate/data/jrc.enc.json
          git commit -m "Job Rate Calculator snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No change"
          git pull --rebase --autostash
          git push
